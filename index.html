<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herdrup</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The layout of herdrup's regular-width NavigationSplitView: a floating
         sidebar card over the detail column (App/HerdrApp.swift iPadLayout). -->
    <main id="detail" class="detail">
      <canvas id="field" class="field"></canvas>
      <p id="select" class="select">Select an agent</p>
      <section id="connect" class="connect" hidden>
        <h1>Connect to a machine</h1>
        <p class="dim">Herdrup logs in over SSH and runs <code>herdr api-bridge</code> there.</p>
        <form id="connect-form" class="form">
          <label>Host<input name="host" required autocomplete="off" placeholder="my-server.example" /></label>
          <label class="short">Port<input name="port" type="number" min="1" max="65535" value="22" /></label>
          <label>User<input name="user" required autocomplete="off" /></label>
          <label>Private key file<input name="keyPath" autocomplete="off" placeholder="~/.ssh/id_ed25519" /></label>
          <label>Password <span class="faint">(if no key, never saved)</span><input name="password" type="password" /></label>
          <label>herdr session <span class="faint">(optional)</span><input name="session" autocomplete="off" placeholder="default" /></label>
          <p id="connect-error" class="error" hidden></p>
          <div class="form-actions">
            <button type="submit">Connect</button>
            <button id="disconnect" type="button" class="ghost" hidden>Disconnect</button>
          </div>
        </form>
      </section>
    </main>

    <aside class="sidebar" id="sidebar">
      <header class="topbar">
        <div class="bar-row">
          <div class="capsule" id="bar-leading"></div>
          <div class="bar-title" id="bar-title">Agents</div>
          <div class="capsule" id="bar-actions"></div>
        </div>
      </header>
      <div class="roster" id="roster">
        <label class="search" id="search-field">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
        </label>
        <div id="rows"></div>
      </div>
      <nav class="tabbar" id="tabbar"></nav>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
