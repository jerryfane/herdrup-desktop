name: Release

# A v* tag builds the installers with mygo build (docs/distribution.md of
# mygo), checks each one on its OS, and publishes them with SHA256SUMS on
# the tag's GitHub release: the macOS disk image, the Windows installer, and
# the Linux Debian package, archive and install.sh. Run on demand or on a
# push to a feat/package-* branch, it builds and checks the same files and
# keeps them as artifacts of the run, without a release.
on:
  push:
    tags: ["v*"]
    branches: ["feat/package-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS. One universal app, for Apple silicon and
          # Intel Macs. GitHub's hosted Macs are shared with herdrup's iOS
          # CI: this is the workflow's only macOS job.
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          # MyGo needs no cgo, so Ubuntu cross-builds Windows, with NSIS for
          # the installer.
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64 }
          - { name: Linux, os: ubuntu-latest, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install NSIS for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Signing hook, off: it runs only once the repository variable
      # MACOS_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)") and
      # the secrets MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID,
      # APPLE_TEAM_ID and APPLE_APP_PASSWORD exist (README.md, "Signing macOS
      # builds"). mygo.config.ts then signs with the identity and notarizes
      # with the profile stored here; without them the app is signed ad hoc.
      - name: Import the Developer ID certificate and notary credentials (off until configured)
        if: matrix.name == 'macOS' && vars.MACOS_SIGNING_IDENTITY != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "HERDRUP_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "HERDRUP_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build -- -platform "${{ matrix.platform }}"
      # The disk image is checked here rather than in a job of its own, to
      # hold one shared Mac instead of two.
      - name: Check the disk image
        if: matrix.name == 'macOS'
        run: |
          dmg="$(ls build/darwin-universal/*.dmg)"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt"
          app="$mnt/Herdrup.app"
          test -x "$app/Contents/MacOS/Herdrup"
          test -L "$mnt/Applications"
          archs="$(lipo -archs "$app/Contents/MacOS/Herdrup")"
          echo "architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 "$app"
          # It starts and keeps running from the disk image.
          "$app/Contents/MacOS/Herdrup" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid" || { cat "$RUNNER_TEMP/app.log"; exit 1; }
          kill "$pid"; wait "$pid" || true
      # Into one folder, so that the artifact holds the files themselves and
      # not the build/<os>-<arch>/ folders around them.
      - name: Collect the installers
        run: |
          mkdir "$RUNNER_TEMP/installers"
          find build -mindepth 2 -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup-*.exe' \
            -o -name '*.deb' -o -name '*.tar.gz' -o -name install.sh \) -exec cp {} "$RUNNER_TEMP/installers/" \;
          ls -l "$RUNNER_TEMP/installers"
      - uses: actions/upload-artifact@v4
        with:
          name: herdrup-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/installers/

  check-windows:
    name: Check the Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdrup-Windows
          path: dist
      - name: Install silently, run, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Filter '*-setup-*.exe').FullName
          if (-not $setup) { throw 'no installer' }
          # A PE image: "MZ", and the "PE\0\0" signature where e_lfanew points.
          $bytes = [IO.File]::ReadAllBytes($setup)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or [Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne "PE`0`0") { throw 'not a PE image' }
          $dir = Join-Path $env:RUNNER_TEMP 'HerdrupInstall'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-ChildItem $dir
          if (-not (Test-Path "$dir\Herdrup.exe")) { throw 'Herdrup.exe not installed' }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw 'Uninstall.exe not installed' }
          # It starts and keeps running.
          $app = Start-Process -FilePath "$dir\Herdrup.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Herdrup.exe exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $app.WaitForExit()
          # _? keeps the uninstaller in place, so -Wait waits for it.
          $u = Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          if (Test-Path "$dir\Herdrup.exe") { throw 'Herdrup.exe left after uninstall' }

  check-linux:
    name: Check the Debian package and install.sh
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A fresh system, so the package's dependencies are what installs the
    # libraries the app needs.
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdrup-Linux
          path: dist
      - name: Install the Debian package and run it
        run: |
          set -eu
          apt-get update
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb xvfb xauth
          test -x /opt/herdrup/herdrup
          test -f /usr/share/applications/herdrup.desktop
          # It starts and keeps running: timeout ends it after 15 s (124).
          status=0
          xvfb-run -a timeout 15 /opt/herdrup/herdrup > app.log 2>&1 || status=$?
          cat app.log
          test "$status" = 124
          apt-get remove -y herdrup
          test ! -e /opt/herdrup/herdrup
      - name: Install with install.sh as a user
        run: |
          set -eu
          useradd -m tester
          cp dist/*.tar.gz dist/install.sh /home/tester/
          chown tester /home/tester/*
          su tester -c 'cd && sh install.sh herdrup-*-linux-amd64.tar.gz'
          test -x /home/tester/.local/herdrup.app/herdrup
          su tester -c 'cd && sh install.sh --uninstall'
          test ! -e /home/tester/.local/herdrup.app

  publish:
    name: Checksums, and the release of a tag
    needs: [build, check-windows, check-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release of a tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herdrup-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          retention-days: 14
          path: dist/SHA256SUMS
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Herdrup $GITHUB_REF_NAME" --generate-notes $prerelease dist/*
