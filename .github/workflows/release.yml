name: Release

# A v* tag builds the installers with mygo build (docs/distribution.md of
# mygo), checks each one on its OS, and publishes them with SHA256SUMS on
# the tag's GitHub release: the macOS disk image, the Windows installer, and
# the Linux Debian package, archive and install.sh. Once mygo.config.ts has
# the public key of app updates and the secret MYGO_UPDATER_PRIVATE_KEY
# exists (README.md, "Signing app updates"), it also signs each platform's
# update and publishes its archive, deltas and update-<platform>.json, which
# installed apps check; without either, the release is as before. Run on
# demand, it builds and checks the same files and keeps them as artifacts of
# the run, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS. One universal app, for Apple silicon and
          # Intel Macs. GitHub's hosted Macs are shared with herdrup's iOS
          # CI: this is the workflow's only macOS job.
          - { name: macOS, artifact: macOS, os: macos-latest, platform: darwin/universal }
          # The offline speech engine requires a current Windows SDK.
          # Build it with MSVC rather than Ubuntu's older MinGW headers.
          - { name: Windows, artifact: Windows, os: windows-latest, platform: windows/amd64 }
          - { name: Linux, artifact: Linux, os: ubuntu-latest, platform: linux/amd64 }
          # Raspberry Pi 4/5 (64-bit OS), built natively on GitHub's Arm runner so its
          # update is signed like the others and the Pi updates itself (#126). Both
          # Linux builds write the same install.sh, which picks the archive by
          # architecture.
          - { name: Linux arm64, artifact: Linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install NSIS for the Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Signing hook, off: it runs only once the repository variable
      # MACOS_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)") and
      # the secrets MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID,
      # APPLE_TEAM_ID and APPLE_APP_PASSWORD exist (README.md, "Signing macOS
      # builds"). mygo.config.ts then signs with the identity and notarizes
      # with the profile stored here; without them the app is signed ad hoc.
      - name: Import the Developer ID certificate and notary credentials (off until configured)
        if: matrix.name == 'macOS' && vars.MACOS_SIGNING_IDENTITY != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "HERDRUP_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "HERDRUP_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Offline speech resources
        uses: ./.github/actions/speech
        with:
          platform: ${{ matrix.platform }}
      # The secret signs app updates; it is empty, and mygo build makes no
      # update files but the Linux archive, until the owner sets it.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          # Only these builds send usage pings and crash reports (app/usage_ping.go release).
          MYGO_LDFLAGS: -X main.release=1
        run: bun run build -- -platform "${{ matrix.platform }}"
      # The disk image is checked here rather than in a job of its own, to
      # hold one shared Mac instead of two.
      - name: Check the disk image
        if: matrix.name == 'macOS'
        run: |
          set -euo pipefail
          dmg="$(ls build/darwin-universal/*.dmg)"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt"
          app="$mnt/herdrup.app"
          test -x "$app/Contents/MacOS/herdrup"
          test -L "$mnt/Applications"
          archs="$(lipo -archs "$app/Contents/MacOS/herdrup")"
          echo "architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 "$app"
          # It starts and keeps running from the disk image.
          "$app/Contents/MacOS/herdrup" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid" || { cat "$RUNNER_TEMP/app.log"; exit 1; }
          kill "$pid"; wait "$pid" || true
          # With Developer ID signing on, what Gatekeeper and the notary see:
          # the hardened runtime, a secure timestamp and the microphone
          # entitlement on the app and the speech helper, the notarized verdict
          # of the app and the disk image, and the stapled tickets. Skipped
          # with ad hoc signing.
          if [ -n "${HERDRUP_SIGNING_IDENTITY:-}" ]; then
            # check <regex…> -- <command…>: prints the command and its output,
            # and fails unless the command succeeds and each regex matches a
            # line of that output.
            check() {
              local patterns=() pattern output status=0
              while [ "$1" != -- ]; do patterns+=("$1"); shift; done
              shift
              echo "+ $*"
              output="$("$@" 2>&1)" || status=$?
              printf '%s\n' "$output"
              if [ "$status" -ne 0 ]; then echo "::error::$1 failed with status $status"; return 1; fi
              for pattern in ${patterns[@]+"${patterns[@]}"}; do
                grep -Eq -- "$pattern" <<<"$output" || { echo "::error::$1: no line matching $pattern"; return 1; }
              done
            }
            # audio_input <code>: fails unless the signature of code holds
            # com.apple.security.device.audio-input as boolean true (JSON
            # keeps the plist type, so a string "true" fails).
            audio_input() {
              local code="$1" plist="$RUNNER_TEMP/entitlements.plist" json
              echo "+ codesign -d --entitlements :- $code"
              codesign -d --entitlements :- "$code" > "$plist" || { echo "::error::no entitlements of $code"; return 1; }
              json="$(plutil -convert json -o - "$plist")" || { echo "::error::unreadable entitlements of $code"; return 1; }
              printf '%s\n' "$json"
              jq -e '."com.apple.security.device.audio-input" == true' <<<"$json" > /dev/null \
                || { echo "::error::com.apple.security.device.audio-input of $code is not boolean true"; return 1; }
            }
            helper="$app/Contents/Resources/herdrup-speech"
            for code in "$app" "$helper"; do
              check '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' '^Timestamp=' -- codesign -d --verbose=2 "$code"
              # The app is the helper's responsible process: both need it.
              audio_input "$code"
            done
            # Online Gatekeeper accepts the notarized app without a staple.
            check '^source=Notarized Developer ID' -- spctl -a -vv -t exec "$app"
            check '^source=Notarized Developer ID' -- spctl -a -vv -t open --context context:primary-signature "$dmg"
            # mygo v0.7.1 staples the disk image and the app it built, which
            # updates install, but not the copy in the image ("The image's
            # copy stays without it", cmd/mygo/dmg.go). Each staple is
            # required on its own: the disk image, the built app, and the app
            # of each update archive, which mygo makes from the built app when
            # updates are signed. All three are the app of the disk image: the
            # built app has its name, and each archive holds that bundle as its
            # only root entry, as the updater requires.
            check -- xcrun stapler validate "$dmg"
            bundle="$(basename "$app")"
            built_apps=(build/darwin-universal/*.app)
            if [ "${#built_apps[@]}" -ne 1 ] || [ "${built_apps[0]}" != "build/darwin-universal/$bundle" ] || [ ! -d "${built_apps[0]}" ]; then
              echo "::error::expected build/darwin-universal/$bundle as the only app there, found: ${built_apps[*]}"
              exit 1
            fi
            check -- xcrun stapler validate "build/darwin-universal/$bundle"
            for archive in build/darwin-universal/*.tar.gz; do
              [ -f "$archive" ] || continue
              unpacked="$(mktemp -d "$RUNNER_TEMP/update.XXXXXX")"
              check -- tar -xzf "$archive" -C "$unpacked"
              root_entries="$(ls -A "$unpacked")"
              if [ "$root_entries" != "$bundle" ] || [ ! -d "$unpacked/$bundle" ]; then
                echo "::error::$archive must hold only $bundle at its root, found: $(tr '\n' ' ' <<<"$root_entries")"
                exit 1
              fi
              check -- xcrun stapler validate "$unpacked/$bundle"
            done
          fi
      # Into one folder, so that the artifact holds the files themselves and
      # not the build/<os>-<arch>/ folders around them. With signed updates,
      # every platform also has its archive (*.tar.gz), deltas (*.delta) and
      # manifest (update-<platform>.json); the manifests name the archives
      # and deltas by these file names in the tag's release.
      - name: Collect the installers
        run: |
          mkdir "$RUNNER_TEMP/installers"
          find build -mindepth 2 -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup-*.exe' \
            -o -name '*.deb' -o -name '*.tar.gz' -o -name install.sh \
            -o -name '*.delta' -o -name 'update-*.json' \) -exec cp {} "$RUNNER_TEMP/installers/" \;
          # GitHub normalizes '~' to '.' in asset names. Do it before the
          # artifacts and checksum manifest diverge; package metadata stays intact.
          for file in "$RUNNER_TEMP/installers/"*'~'*.deb; do
            [ -f "$file" ] || continue
            mv -- "$file" "${file//\~/.}"
          done
          ls -l "$RUNNER_TEMP/installers"
      - uses: actions/upload-artifact@v4
        with:
          name: herdrup-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/installers/

  check-windows:
    name: Check the Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdrup-Windows
          path: dist
      - name: Install silently, run, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Filter '*-setup-*.exe').FullName
          if (-not $setup) { throw 'no installer' }
          # A PE image: "MZ", and the "PE\0\0" signature where e_lfanew points.
          $bytes = [IO.File]::ReadAllBytes($setup)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or [Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne "PE`0`0") { throw 'not a PE image' }
          $dir = Join-Path $env:RUNNER_TEMP 'HerdrupInstall'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-ChildItem $dir
          if (-not (Test-Path "$dir\herdrup.exe")) { throw 'herdrup.exe not installed' }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw 'Uninstall.exe not installed' }
          # It starts and keeps running.
          $app = Start-Process -FilePath "$dir\herdrup.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "herdrup.exe exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $app.WaitForExit()
          # _? keeps the uninstaller in place, so -Wait waits for it.
          $u = Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          if (Test-Path "$dir\herdrup.exe") { throw 'herdrup.exe left after uninstall' }

  check-linux:
    name: Check the Debian package and install.sh (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest, artifact: Linux }
          - { arch: arm64, os: ubuntu-24.04-arm, artifact: Linux-arm64 }
    # A fresh system, so the package's dependencies are what installs the
    # libraries the app needs.
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdrup-${{ matrix.artifact }}
          path: dist
      - name: Install the Debian package and run it
        run: |
          set -eu
          apt-get update
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb xvfb xauth
          test -x /opt/herdrup/herdrup
          test -f /usr/share/applications/herdrup.desktop
          # It starts and keeps running: timeout ends it after 15 s (124).
          status=0
          xvfb-run -a timeout 15 /opt/herdrup/herdrup > app.log 2>&1 || status=$?
          cat app.log
          test "$status" = 124
          apt-get remove -y herdrup
          test ! -e /opt/herdrup/herdrup
      - name: Install with install.sh as a user
        run: |
          set -eu
          useradd -m tester
          cp dist/*.tar.gz dist/install.sh /home/tester/
          chown tester /home/tester/*
          su tester -c 'cd && sh install.sh herdrup-*-linux-${{ matrix.arch }}.tar.gz'
          test -x /home/tester/.local/herdrup.app/herdrup
          su tester -c 'cd && sh install.sh --uninstall'
          test ! -e /home/tester/.local/herdrup.app

  # The Microsoft Store package (README.md, "Microsoft Store package"): the
  # Windows app built with -X main.distribution=store, whose updates come
  # from the Store (app/store.go), packed by packaging/msix with the Windows
  # SDK's makeappx. Two variants of one recipe:
  # - ci, on every run: packed with a placeholder identity, signed with a
  #   throwaway certificate, installed, opened by a herdrup:// link as
  #   Windows opens a packaged app's protocol, and removed, as check-windows
  #   does with the installer;
  # - store, once the owner reserved the app's name in Partner Center and set
  #   its identity as the repository variables MSIX_IDENTITY_NAME,
  #   MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME, all three required:
  #   unsigned, as the Store signs what it publishes, and carried by the
  #   release as herdrup-<version>-store.msix for the owner to submit in
  #   Partner Center.
  # Without MSIX_IDENTITY_NAME the matrix has no store variant, so the job
  # is never skipped and the release is as before.
  msix:
    name: Microsoft Store package (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(vars.MSIX_IDENTITY_NAME != '' && '["ci", "store"]' || '["ci"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the Store identity
        if: matrix.variant == 'store'
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          for v in MSIX_IDENTITY_NAME MSIX_PUBLISHER MSIX_PUBLISHER_DISPLAY_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::Set the repository variable $v (Partner Center, Product identity; README.md, \"Microsoft Store package\")"
              exit 1
            fi
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Offline speech resources
        uses: ./.github/actions/speech
        with:
          platform: windows/amd64
      # The store variant sends usage pings and crash reports as every
      # release build does (main.release). Not ci: the shell starts the
      # packaged app outside this job's environment, whose CI variable keeps
      # a release build from sending them (app/usage_ping.go).
      - name: Build in Store mode
        env:
          MYGO_LDFLAGS: ${{ matrix.variant == 'store' && '-X main.release=1 -X main.distribution=store' || '-X main.distribution=store' }}
        run: bun run build -- -platform windows/amd64
      - name: Pack
        env:
          VARIANT: ${{ matrix.variant }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [ "$VARIANT" = store ]; then
            name="$MSIX_IDENTITY_NAME" publisher="$MSIX_PUBLISHER" display="$MSIX_PUBLISHER_DISPLAY_NAME"
          else
            name=HerdrupCI publisher=CN=HerdrupCI display=HerdrupCI
          fi
          version="$(jq -r .version package.json)"
          out="$RUNNER_TEMP/msix-out/herdrup-$version-$VARIANT.msix"
          go run ./packaging/msix pack -from build/windows-amd64 -stage "$RUNNER_TEMP/msix-stage" \
            -name "$name" -publisher "$publisher" -publisher-display-name "$display" -out "$out"
          ls -l "$RUNNER_TEMP/msix-out"
          echo "MSIX=$out" >> "$GITHUB_ENV"
      - name: Find signtool
        if: matrix.variant == 'ci'
        run: |
          signtool="$(go run ./packaging/msix tool signtool)"
          echo "SIGNTOOL=$signtool" >> "$GITHUB_ENV"
      # Windows PowerShell: its Appx module is the one Windows ships.
      - name: Sign, install, open a herdrup:// link, remove
        if: matrix.variant == 'ci'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = [IO.Path]::GetFullPath($env:MSIX)
          # A throwaway code signing certificate whose subject is the
          # placeholder publisher, trusted for packages on this runner only.
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=HerdrupCI' -KeyUsage DigitalSignature `
            -FriendlyName 'HerdrupCI' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool exited with $LASTEXITCODE" }
          $cer = Join-Path $env:RUNNER_TEMP 'HerdrupCI.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          # Installing trusted packages (sideloading), the default since
          # Windows 10 2004; set in case the runner's image turned it off.
          $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $unlock)) { New-Item -Path $unlock | Out-Null }
          Set-ItemProperty -Path $unlock -Name AllowAllTrustedApps -Value 1 -Type DWord
          try {
            Add-AppxPackage -Path $msix
          } catch {
            Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 30 |
              Format-List TimeCreated, Id, Message
            throw
          }
          $pkg = Get-AppxPackage -Name HerdrupCI
          if (-not $pkg) { throw 'HerdrupCI not installed' }
          $pkg | Format-List Name, Version, PackageFullName, PackageFamilyName, InstallLocation
          Get-ChildItem $pkg.InstallLocation -Recurse | Select-Object -ExpandProperty FullName
          foreach ($f in 'herdrup.exe', 'herdrup-speech.exe', 'ggml-tiny.bin', 'whisper-LICENSE', 'speech-LICENSES', 'AppxManifest.xml') {
            if (-not (Test-Path (Join-Path $pkg.InstallLocation $f))) { throw "$f not installed" }
          }
          if (Test-Path (Join-Path $pkg.InstallLocation '.herdrup-msix-stage')) { throw 'the staging marker was packed' }
          # A herdrup:// link opens it, through the package's protocol
          # (the Store build doesn't register one itself): the process that
          # runs from the package, until it has its window, and keeps running.
          Start-Process 'herdrup://ci-check'
          $root = $pkg.InstallLocation.TrimEnd('\') + '\'
          $app = $null
          for ($i = 0; $i -lt 30 -and -not $app; $i++) {
            Start-Sleep -Seconds 1
            $app = Get-Process -Name herdrup -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) -and $_.MainWindowHandle -ne 0 } |
              Select-Object -First 1
          }
          if (-not $app) {
            Get-Process -Name herdrup -ErrorAction SilentlyContinue | Format-List Id, Path, MainWindowHandle
            throw 'no herdrup.exe from the package with a window within 30 s'
          }
          Write-Host "herdrup.exe $($app.Id) runs from $($app.Path) with window $($app.MainWindowHandle)"
          Start-Sleep -Seconds 15
          if (-not (Get-Process -Id $app.Id -ErrorAction SilentlyContinue)) { throw 'herdrup.exe exited' }
          Stop-Process -Id $app.Id -Force
          Wait-Process -Id $app.Id -Timeout 30
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name HerdrupCI) { throw 'HerdrupCI left after Remove-AppxPackage' }
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'store'
        with:
          name: herdrup-Store
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/msix-out/

  checksums:
    name: Checksums
    needs: [build, check-windows, check-linux, msix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herdrup-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          retention-days: 14
          path: dist/SHA256SUMS

  # Only a pushed v* tag publishes. A run on demand never does, even when
  # dispatched on a tag ref, and never gets a token that can write.
  publish:
    name: Release of a tag
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release
    steps:
      # Every artifact of the run: the installers (herdrup-*), with signed
      # updates their archives, deltas and update-*.json, and SHA256SUMS.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Not a prerelease, even for a preview tag: GitHub's releases/latest, which the
          # guest invite page links computers to, skips prereleases.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "herdrup $GITHUB_REF_NAME" --generate-notes --latest dist/*
