name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Vendored MyGo correction matches its pinned source patch
        run: |
          bun run vendor:mygo
          test -z "$(git status --porcelain -- vendor)"
      - name: Bindings match the Go code
        run: bun run generate && git diff --exit-code src/mygo.ts
      - name: Design tokens and fonts match the pinned herdrup commit
        run: go run ./cmd/herdrup-sync -check -upstream
      - name: herdr API types match the pinned herdr schema
        run: go run ./cmd/herdr-api-gen -check -upstream
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - run: bun run typecheck
      - name: Install NSIS for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      # MyGo needs no cgo, so Ubuntu compiles every platform; macOS disk
      # images need macOS and are skipped here.
      - name: Build for macOS, Windows and Linux
        run: bun run build -- -platform darwin/arm64,darwin/amd64,windows/amd64,linux/amd64 -skip-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: herdrup-builds
          retention-days: 7
          path: |
            build/darwin-*/
            build/windows-amd64/*.exe
            build/linux-amd64/*.deb
            build/linux-amd64/*.tar.gz

  # Opens the real window on each OS against cmd/fakeherdr, a canned herdr
  # served over SSH, and saves a screenshot once the board shows agents.
  smoke:
    name: Window smoke (${{ matrix.os }})
    # macOS runners are GitHub's hosted ones, shared with herdrup's iOS CI:
    # run them on main, on demand, and on pull requests labelled
    # macos-smoke. (The MacBook Air runner, mcb-air-herdrup-desktop, is
    # offline since its macOS update on 2026-10-29; jobs pinned to it would
    # wait forever.)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos-smoke')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # mygo's npm launcher (node_modules/.bin/mygo) is a Node script. With no
      # Node on the machine, Bun runs it, and Bun's process.execve without an
      # env argument starts mygo with an empty environment (no PATH), so it
      # cannot find Bun for mygo.config.ts. Hosted runners ship Node; the
      # MacBook Air runner does not.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - name: Fetch pinned offline speech engine
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: 927cfce34f31707e17f2bff35c349632fb9e2c3a
          path: .speech-source
      - name: Build offline speech resources for the existing smoke runner
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        env:
          WHISPER_SOURCE: ${{ github.workspace }}/.speech-source
          HERDRUP_SPEECH_RESOURCES: ${{ runner.temp }}/speech-resources
        run: |
          case "$RUNNER_OS" in
            Linux) bun speech/build.ts linux/amd64 ;;
            Windows) bun speech/build.ts windows/amd64 ;;
          esac
      - name: Build the app with the smoke hook
        shell: bash
        env:
          MYGO_LDFLAGS: -X main.smoke=1
        run: bun run build -- -skip-dmg
      - name: Open the window against the fake herdr and capture it
        shell: bash
        env:
          HERDRUP_SMOKE_HOST: 127.0.0.1
          HERDRUP_SMOKE_PORT: "2222"
          HERDRUP_SMOKE_USER: ci
          HERDRUP_SMOKE_KEY: ${{ runner.temp }}/client.key
          HERDRUP_SMOKE_CAPTURE: ${{ runner.temp }}/herdrup-${{ runner.os }}.png
          HERDRUP_SMOKE_LOG: ${{ runner.temp }}/herdrup-smoke.log
          # The app's throwaway user data (main.go) goes here, which the
          # runner clears after the job, also on the self-hosted MacBook Air.
          TMPDIR: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/fakeherdr$(go env GOEXE)"
          go build -o "$bin" ./cmd/fakeherdr
          "$bin" -listen 127.0.0.1:2222 -client-key "$RUNNER_TEMP/client.key" -interactions > "$RUNNER_TEMP/fakeherdr.log" 2>&1 &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/client.key" ] && break; sleep 0.2; done
          test -s "$RUNNER_TEMP/client.key" || { cat "$RUNNER_TEMP/fakeherdr.log"; exit 1; }
          show_logs() { echo "--- app"; cat "$HERDRUP_SMOKE_LOG" 2>/dev/null; echo "--- fakeherdr"; cat "$RUNNER_TEMP/fakeherdr.log"; }
          trap show_logs EXIT
          case "$RUNNER_OS" in
            Linux) xvfb-run -a -s "-screen 0 1280x900x24" build/linux-amd64/herdrup ;;
            macOS) "$(ls -d build/darwin-*/Herdrup.app)/Contents/MacOS/Herdrup" ;;
            Windows)
              # A GUI executable: wait for it and take its exit code.
              pwsh -NoProfile -Command '$p = Start-Process -FilePath "build/windows-amd64/Herdrup.exe" -Wait -PassThru; exit $p.ExitCode' ;;
          esac
          test -s "$HERDRUP_SMOKE_CAPTURE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/herdrup-${{ runner.os }}.png
            ${{ runner.temp }}/herdrup-${{ runner.os }}.png-preview-*.png
            ${{ runner.temp }}/herdrup-${{ runner.os }}.png-typing.*
